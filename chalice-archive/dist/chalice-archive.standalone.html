<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chalice Archive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Forum&family=Martian+Mono:wght@300;400&display=swap">
<style id="ca-style">
/* Layout: one dark stage where the construct is the only bright object; scanning it unfolds a copper-framed archive plate over the stage */
:root {
  --void: #0a0e1a;
  --void-2: #10172a;
  --void-3: #172038;
  --line: #222d47;
  --line-strong: #34415f;
  --ink: #dde6ec;
  --ink-dim: #96a3b5;
  --ink-faint: #70809a;
  --copper: #cf8a55;
  --copper-dim: #7e5034;
  --teal: #66efdc;
  --teal-dim: #2f8c84;
  --amber: #e3b65e;
  --rose: #de8f8a;
  --teal-rgb: 102 239 220;
  --copper-rgb: 207 138 85;
  --shade-rgb: 4 7 14;
  --font-display: "Forum", "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
  --font-body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
#ca-root { min-height: 100%; display: flex; flex-direction: column; }
#ca-root > .stage { flex: 1 0 auto; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
::selection { background: rgb(var(--teal-rgb) / .3); }

.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--copper); }

/* ---------- Stage ---------- */
.stage {
  position: relative; isolation: isolate; overflow: hidden; box-sizing: border-box; min-height: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto;
  grid-template-areas: "mast tally" "core core" "latest latest";
  gap: 20px 32px;
  padding-inline: clamp(16px, 4vw, 56px); padding-block: clamp(20px, 4vh, 44px);
  background:
    radial-gradient(ellipse 40% 44% at 50% 52%, rgb(var(--teal-rgb) / .08), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 55%, var(--void-2) 0%, var(--void) 62%);
}
.stage::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 55%, rgb(var(--shade-rgb) / .7)); }
.motes { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

.masthead { grid-area: mast; display: flex; flex-direction: column; gap: 12px; min-width: 0; max-width: 40rem; }
.title { margin: 0; font-family: var(--font-display); font-weight: 400; line-height: .95; text-wrap: balance; }
.title-pre { display: block; font-size: clamp(18px, 2.2vw, 24px); color: var(--ink-dim); letter-spacing: .02em; margin-bottom: 8px; }
.title-name { display: block; font-size: clamp(40px, 6.4vw, 76px); color: var(--ink); letter-spacing: .01em; overflow-wrap: anywhere; }
.epithet { margin: 0; color: var(--ink-dim); max-width: 44ch; font-size: 16.5px; }

.tally { grid-area: tally; display: flex; gap: 26px; align-items: flex-start; margin: 0; }
.tally > div { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.tally-num { font-family: var(--font-mono); font-weight: 300; font-size: 28px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.tally-num.is-teal { color: var(--teal); }
.tally-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }

.core { grid-area: core; --size: clamp(190px, 22vw + 110px, 330px); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 360px; padding-block: 20px; }
.construct { position: relative; width: var(--size); max-width: 100%; aspect-ratio: 364 / 410; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.fx { position: absolute; inset: 0; display: block; }
.fx-x { animation: drift-x 13s ease-in-out infinite alternate; }
.fx-y { animation: bob 5.6s ease-in-out infinite; }
.fx-tilt { animation: tilt 9s ease-in-out infinite alternate; }
@keyframes drift-x { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
@keyframes bob { 0%, 100% { transform: translateY(6px); } 50% { transform: translateY(-14px); } }
@keyframes tilt { from { transform: rotate(-2.4deg); } to { transform: rotate(2.2deg); } }
.halo { position: absolute; left: 50%; top: 54%; width: 150%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, rgb(var(--teal-rgb) / .14), transparent 62%); animation: halo 5.6s ease-in-out infinite; }
@keyframes halo { 0%, 100% { opacity: .65; scale: .96; } 50% { opacity: 1; scale: 1.04; } }
.ring { position: absolute; left: 50%; top: 56%; width: 140%; aspect-ratio: 1; translate: -50% -50%; color: var(--copper); opacity: .3; overflow: visible; animation: spin 90s linear infinite; transition: opacity .4s; }
.ring .r2 { color: var(--teal); }
@keyframes spin { to { rotate: 360deg; } }
.construct-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; filter: drop-shadow(0 0 22px rgb(var(--teal-rgb) / .16)) drop-shadow(0 24px 26px rgb(var(--shade-rgb) / .85)); transition: filter .4s, opacity .8s; }
.gem { position: absolute; left: 50%; top: 80.2%; width: 34%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; background: radial-gradient(circle, rgb(var(--teal-rgb) / .55) 0%, rgb(var(--teal-rgb) / .16) 34%, transparent 66%); animation: gem 3.4s ease-in-out infinite; transition: opacity .8s; }
@keyframes gem { 0%, 100% { opacity: .5; scale: .9; } 50% { opacity: 1; scale: 1.08; } }
.construct:hover .construct-img, .construct:focus-visible .construct-img { filter: drop-shadow(0 0 30px rgb(var(--teal-rgb) / .34)) drop-shadow(0 24px 26px rgb(var(--shade-rgb) / .85)); }
/* The 3D model: the canvas overhangs the button so the hover and the glow never clip. The cutout stays underneath until the first frame is drawn. */
.construct-gl { position: absolute; left: -22%; top: -16%; width: 144%; height: 144%; pointer-events: none; opacity: 0; transition: opacity .8s; }
.core { --lift: .5; }
.is-3d .construct-gl { opacity: 1; }
.core.is-3d .construct-img, .core.is-3d .gem { opacity: 0; animation: none; } /* outranks .is-scanning .gem, whose flare would bring the overlay back */
.is-3d .fx-y { animation: none; }
.is-3d .halo { animation: none; opacity: calc(.65 + .35 * var(--lift)); scale: calc(.96 + .08 * var(--lift)); }
.is-3d .pool { animation: none; opacity: calc(.9 - .45 * var(--lift)); scale: calc(1 - .2 * var(--lift)); }
.construct:hover .ring, .construct:focus-visible .ring { opacity: .55; }
.lock { position: absolute; inset: -10%; pointer-events: none; opacity: 0; transition: opacity .25s, inset .5s cubic-bezier(.2, .8, .2, 1); }
.lock i { position: absolute; width: 20px; height: 20px; border: 0 solid var(--teal); filter: drop-shadow(0 0 6px rgb(var(--teal-rgb) / .6)); }
.lock i:nth-child(1) { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
.lock i:nth-child(2) { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
.lock i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
.lock i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }
.is-scanning .lock { opacity: 1; inset: -2%; }
.is-scanning .gem { animation: flare 1.9s ease-out forwards; }
@keyframes flare { 0% { opacity: .8; scale: 1; } 18% { opacity: 1; scale: 2.6; } 100% { opacity: .9; scale: 1.3; } }
.is-scanning .ring { opacity: .7; animation-duration: 5s; }
.is-scanning .fx-y, .is-scanning .fx-x, .is-scanning .fx-tilt { animation-play-state: paused; }
.pool { width: calc(var(--size) * .55); height: 22px; margin-top: 2px; border-radius: 50%; background: radial-gradient(ellipse, rgb(var(--teal-rgb) / .22), transparent 70%); filter: blur(4px); animation: pool 5.6s ease-in-out infinite; }
@keyframes pool { 0%, 100% { opacity: .9; scale: 1; } 50% { opacity: .45; scale: .8; } }
.hint { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; text-align: center; color: var(--ink-dim); transition: color .3s; }
.hint::before { content: ""; flex: none; width: 6px; height: 6px; rotate: 45deg; background: var(--teal); box-shadow: 0 0 10px var(--teal); animation: blink 2.2s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.core:has(.construct:hover) .hint { color: var(--ink); }

.latest { grid-area: latest; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; min-width: 0; padding: 16px 0 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.latest:disabled { cursor: default; }
.latest-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--copper); }
.latest-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.latest-title { min-width: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.2; color: var(--ink); transition: color .2s; }
.latest:not(:disabled):hover .latest-title { color: var(--teal); }

/* ---------- Scan overlay ---------- */
.scan { position: fixed; inset: 0; z-index: 50; overflow: hidden; pointer-events: none; }
.scan::before { content: ""; position: absolute; inset: 0; background: rgb(var(--teal-rgb) / .05); opacity: 0; }
.scan-grid { position: absolute; inset: 0; clip-path: inset(0 0 100% 0); background-image: linear-gradient(rgb(var(--teal-rgb) / .09) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--teal-rgb) / .09) 1px, transparent 1px); background-size: 34px 34px; background-position: center; }
.scan-beam { position: absolute; left: 0; right: 0; top: 0; height: 140px; transform: translateY(-140px); background: linear-gradient(to bottom, transparent, rgb(var(--teal-rgb) / .12) 88%, rgb(var(--teal-rgb) / .35)); }
.scan-beam::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--teal); box-shadow: 0 0 18px 3px rgb(var(--teal-rgb) / .7), 0 0 60px 8px rgb(var(--teal-rgb) / .25); }
.scan.run::before { animation: tint 1.9s ease-out forwards; }
.scan.run .scan-grid { animation: grid-reveal 1.45s cubic-bezier(.55, 0, .35, 1) forwards, grid-fade .5s 1.4s ease-out forwards; }
.scan.run .scan-beam { animation: beam 1.45s cubic-bezier(.55, 0, .35, 1) forwards; }
@keyframes tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
@keyframes grid-reveal { to { clip-path: inset(0 0 0 0); } }
@keyframes grid-fade { to { opacity: 0; } }
@keyframes beam { to { transform: translateY(calc(100vh - 138px)); opacity: .2; } }
.scan-readout { position: absolute; left: clamp(16px, 4vw, 56px); bottom: 16%; margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 2; color: var(--teal); white-space: pre; text-shadow: 0 0 12px rgb(var(--teal-rgb) / .5); }

/* ---------- Archive plate ---------- */
.archive { width: min(1100px, calc(100% - 32px)); max-width: none; max-height: none; margin: auto; padding: 0; border: 0; background: transparent; color: var(--ink); overflow: visible; }
.archive::backdrop { background: rgb(var(--shade-rgb) / .74); backdrop-filter: blur(2px); }
.frame { position: relative; }
.frame::before, .frame::after { content: ""; position: absolute; z-index: 2; width: 26px; height: 26px; border: 0 solid var(--copper); pointer-events: none; }
.frame::before { top: -5px; left: -5px; border-top-width: 2px; border-left-width: 2px; }
.frame::after { bottom: -5px; right: -5px; border-bottom-width: 2px; border-right-width: 2px; }
.archive[open] .frame { animation: unfold .46s cubic-bezier(.2, .85, .25, 1); }
@keyframes unfold { from { clip-path: inset(47% -10px 47% -10px); opacity: .2; } to { clip-path: inset(-10px); opacity: 1; } }
.plate { box-sizing: border-box; min-height: min(660px, calc(100vh - 40px)); max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); overflow: auto; overscroll-behavior: contain; padding: clamp(20px, 3.4vw, 40px); background: linear-gradient(180deg, var(--void-2), var(--void) 70%); border: 1px solid var(--copper-dim); box-shadow: inset 0 0 0 1px rgb(var(--teal-rgb) / .05), 0 40px 90px rgb(var(--shade-rgb) / .7), 0 0 80px rgb(var(--teal-rgb) / .07); scrollbar-width: thin; scrollbar-color: var(--copper-dim) transparent; }
.btn-close { position: absolute; top: 10px; right: 10px; z-index: 3; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--line-strong); background: var(--void-2); color: var(--ink-dim); cursor: pointer; }
.btn-close:hover { color: var(--ink); border-color: var(--copper); }

.ar-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 18px 28px; padding: 0 44px 24px 0; border-bottom: 1px solid var(--line); }
.ar-head h2 { margin: 10px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 4vw, 46px); line-height: 1; text-wrap: balance; overflow-wrap: anywhere; }
.unit { display: flex; align-items: center; gap: 16px; margin-top: 18px; max-width: 46rem; }
.unit img { flex: none; width: 108px; height: auto; filter: drop-shadow(0 0 14px rgb(var(--teal-rgb) / .2)); }
.unit-name { margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 1.2; color: var(--copper); }
.unit-note { margin: 3px 0 0; color: var(--ink-dim); font-size: 15px; line-height: 1.45; }
.ar-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.ro-note { margin: 16px 0 0; font-size: 14px; color: var(--ink-faint); }

.gap { display: grid; gap: 14px; padding-block: 24px; border-bottom: 1px solid var(--line); }
.gap-head { margin: 0; font-family: var(--font-display); font-size: 23px; line-height: 1.25; color: var(--ink); }
.gap-head .num { font-family: var(--font-mono); font-weight: 300; font-size: .85em; color: var(--teal); font-variant-numeric: tabular-nums; }
.gap-bar { display: flex; gap: 3px; height: 8px; }
.gap-seg { flex: var(--n) 1 0; min-width: 4px; background: var(--c); }
.gap-seg[data-s="sought"] { background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 5px); }
.gap-empty { flex: 1; border: 1px dashed var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px 7px 11px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); transition: border-color .2s, background .2s, color .2s; }
.chip .count { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--c); color: var(--ink); background: color-mix(in srgb, var(--c) 13%, transparent); }
.legend-clear { padding: 7px 4px; border: 0; background: none; cursor: pointer; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); text-decoration: underline; text-underline-offset: 3px; }
.legend-clear:hover { color: var(--ink); }

.glyph { flex: none; box-sizing: border-box; width: 9px; height: 9px; rotate: 45deg; border: 1.5px solid var(--c); background: var(--c); }
[data-s="remembered"] { --c: var(--copper); }
[data-s="superseded"] { --c: var(--rose); }
[data-s="relearned"] { --c: var(--teal); }
[data-s="fragment"] { --c: var(--amber); }
[data-s="sought"] { --c: var(--ink-dim); }
.glyph[data-s="fragment"] { background: linear-gradient(135deg, var(--c) 50%, transparent 50%); }
.glyph[data-s="sought"] { background: transparent; }
.glyph[data-s="superseded"] { background: linear-gradient(transparent 36%, var(--c) 36% 64%, transparent 64%); }

.examples { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 22px; padding: 12px 14px; border: 1px dashed var(--line-strong); font-size: 15px; color: var(--ink-dim); }
.examples p { margin: 0; flex: 1 1 20rem; min-width: 0; }
.tag { display: inline-block; margin-left: 8px; padding: 1px 5px; border: 1px solid var(--line-strong); font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); vertical-align: 4px; }

.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); gap: 32px 52px; padding-top: 28px; }
.col-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 14px; font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--copper); }
.col-title span { color: var(--ink-faint); letter-spacing: .06em; }
.empty { margin: 0; padding: 14px 0; color: var(--ink-faint); font-size: 15.5px; }

.recent { position: relative; margin: 0; padding: 0; list-style: none; }
.recent::before { content: ""; position: absolute; left: 4px; top: 14px; bottom: 14px; width: 1px; background: linear-gradient(var(--copper-dim), transparent); }
.rec-btn { display: grid; grid-template-columns: 9px minmax(0, 1fr); column-gap: 18px; row-gap: 3px; width: 100%; padding: 10px 6px 14px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.rec-btn .glyph { grid-row: 1; margin-top: 4px; }
.rec-date { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.rec-title { grid-column: 2; font-family: var(--font-display); font-size: 23px; line-height: 1.15; color: var(--ink); transition: color .2s; }
.rec-note { grid-column: 2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 1.45; color: var(--ink-dim); }
.rec-btn:hover .rec-title { color: var(--teal); }

.index { columns: 2 250px; column-gap: 40px; }
.domain { break-inside: avoid; margin: 0 0 26px; }
.domain-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1.2; color: var(--ink); }
.domain-count { flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.topics { margin: 0; padding: 0; list-style: none; }
.topic { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.topic-title { flex: 1; min-width: 0; font-size: 16.5px; line-height: 1.3; color: var(--ink); transition: color .2s; }
.topic-status { flex: none; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.topic:hover .topic-title { color: var(--teal); }

/* detail */
.detail { max-width: 48rem; padding-top: 22px; }
.back { padding: 6px 0; border: 0; background: none; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.back:hover { color: var(--teal); }
.det-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 22px 0 12px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.det-status { display: inline-flex; align-items: center; gap: 9px; color: var(--c); }
.det-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 4.6vw, 50px); line-height: 1.02; text-wrap: balance; overflow-wrap: anywhere; }
.det-note { margin: 20px 0 0; max-width: 62ch; font-size: 18.5px; line-height: 1.6; white-space: pre-line; color: var(--ink); }
.det-note.is-empty { color: var(--ink-faint); font-style: italic; }
.det-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; margin: 26px 0 0; font-size: 15.5px; }
.det-facts dt { padding-top: 3px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--copper); }
.det-facts dd { margin: 0; color: var(--ink-dim); }
.owner-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--copper-dim); background: transparent; color: var(--ink); cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; transition: border-color .2s, background .2s, color .2s; }
.btn:hover { border-color: var(--copper); background: rgb(var(--copper-rgb) / .08); }
.btn-primary { border-color: var(--copper); background: var(--copper); color: var(--void); }
.btn-primary:hover { background: color-mix(in srgb, var(--copper) 82%, var(--ink)); border-color: color-mix(in srgb, var(--copper) 82%, var(--ink)); }
.btn[data-armed] { border-color: var(--rose); color: var(--rose); background: transparent; }
.btn:disabled { opacity: .55; cursor: progress; }

/* forms */
.form { display: grid; gap: 20px; max-width: 46rem; padding-top: 22px; }
.form h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.05; }
.field { display: grid; gap: 7px; min-width: 0; margin: 0; padding: 0; border: 0; }
.field > label, .field > legend { padding: 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--copper); }
.field > legend { margin-bottom: 7px; }
.help { margin: 0; font-size: 14px; color: var(--ink-faint); }
.input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--void-3); color: var(--ink); font-family: var(--font-body); font-size: 16.5px; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.5; }
.input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgb(var(--teal-rgb) / .14); }
.row-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 20px; }
.status-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.status-opt { position: relative; display: inline-flex; align-items: center; gap: 9px; padding: 9px 13px; border: 1px solid var(--line-strong); cursor: pointer; font-size: 15px; color: var(--ink-dim); transition: border-color .2s, background .2s, color .2s; }
.status-opt input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.status-opt:hover { border-color: var(--c); }
.status-opt:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--ink); }
.status-opt:has(input:focus-visible) { outline: 2px solid var(--teal); outline-offset: 2px; }
.form-error { margin: 0; font-size: 15px; color: var(--rose); }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 100; translate: -50% 0; box-sizing: border-box; max-width: calc(100% - 32px); padding: 12px 18px; border: 1px solid var(--teal-dim); background: var(--void-2); color: var(--ink); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; letter-spacing: .03em; box-shadow: 0 10px 40px rgb(var(--shade-rgb) / .6); }
.toast.show { animation: toast-in .3s ease-out; }
@keyframes toast-in { from { opacity: 0; translate: -50% 10px; } to { opacity: 1; translate: -50% 0; } }

@media (max-width: 820px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .ar-head { grid-template-columns: minmax(0, 1fr); }
  .ar-tools { justify-content: flex-start; }
  .unit img { width: 84px; }
}
@media (max-width: 640px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-areas: "mast" "tally" "core" "latest"; }
  .tally > div { align-items: flex-start; }
  .tally-num { font-size: 22px; }
  .core { min-height: 300px; }
  .archive { width: calc(100% - 24px); }
}
@media (prefers-reduced-motion: reduce) {
  .fx-x, .fx-y, .fx-tilt, .halo, .ring, .gem, .pool, .hint::before { animation: none !important; }
  .archive[open] .frame { animation: none; }
}

<script type="application/json" id="ca-data">{"profile":{"name":"Unnamed Dracthyr","epithet":"Sealed in the Forbidden Reach for ten thousand years. Relearning the world one record at a time.","construct":"Eternal Gladiator's Chalice","constructNote":"An archival construct of Shadowlands make, bought from a broker who asked no questions and answered fewer."},"records":[{"id":"ex1","title":"The Shadowlands","domain":"Cosmology & the beyond","status":"relearned","date":"2026-10-03","added":9,"note":"The realms where souls go after death. The construct was made there, and its memory holds more of that place than any tutor I have found.","source":"The construct's own archive","example":true},{"id":"ex2","title":"The Sundering","domain":"Wars & catastrophes","status":"relearned","date":"2026-10-01","added":8,"note":"The Well of Eternity tore itself apart and the land broke with it. The coastlines I remember flying over are gone.","source":"Maps in a Valdrakken library","example":true},{"id":"ex3","title":"Brokers","domain":"Peoples & factions","status":"relearned","date":"2026-09-30","added":7,"note":"Cloaked merchants who trade between worlds. One sold me this construct and would not say where it came from.","source":"The sale itself","example":true},{"id":"ex4","title":"Neltharion","domain":"Dragonkind & the Aspects","status":"superseded","date":"2026-09-28","added":6,"note":"I remember the Earth-Warder, Aspect of the black flight, who made us. The world now calls him Deathwing. He went mad, broke the world a second time, and was killed.","source":"An older dracthyr in Valdrakken","example":true},{"id":"ex5","title":"The Horde and the Alliance","domain":"Peoples & factions","status":"fragment","date":"2026-09-24","added":5,"note":"Two pacts of the younger races. They fight each other, then fight side by side when something worse arrives. I do not yet know how either began.","source":"Overheard in taverns","example":true},{"id":"ex6","title":"Valdrakken","domain":"Places","status":"relearned","date":"2026-09-20","added":4,"note":"City of the dragonflights on the Dragon Isles. The first place I saw dracthyr welcomed by the other flights, more or less.","source":"Living there","example":true},{"id":"ex7","title":"Draconic speech","domain":"Dragonkind & the Aspects","status":"remembered","date":"2026-09-18","added":3,"note":"The old tongue of dragons. I still speak it better than the trade language everyone here uses.","source":"Before the slumber","example":true},{"id":"ex8","title":"Humans","domain":"Peoples & factions","status":"sought","date":"2026-09-15","added":2,"note":"Short-lived and everywhere. Where did they come from? Everyone assumes I already know.","source":"","example":true},{"id":"ex9","title":"The Scourge","domain":"Wars & catastrophes","status":"sought","date":"2026-09-12","added":1,"note":"Mentioned in passing, always followed by a pause. Undead armies of some kind. I need the whole account.","source":"","example":true}]}</script>

      "  float a = 1.0;",
      "  if (uPixel == 0) c = mix(t0.rgb * t1.rgb * 2.0, t0.rgb, t0.a);", // Combiners_Opaque_Mod2xNA_Alpha
      "  else { c = t0.rgb * t1.rgb; a = t0.a * t1.a; }", // Combiners_Mod_Mod
      "  if (uLit > 0.5) {",
      "    vec3 n = normalize(vNormal);",
      "    vec3 light = uAmbient + uKey * max(dot(n, uKeyDir), 0.0) + uFill * max(dot(n, uFillDir), 0.0);",
      "    float rim = pow(1.0 - clamp(dot(n, normalize(-vView)), 0.0, 1.0), 3.0);",
      "    c = c * light + uTeal * rim * (0.14 + 0.2 * uHover);",
      "  }",
      "  c = c * (1.0 + uGem * (0.2 + 0.35 * uGlow + 1.1 * uFlare)) + uGem * uTeal * (0.06 + 0.2 * uGlow + 0.5 * uFlare);",
      // distance in CSS px from the page's scan line, in the screen's frame (the canvas sits in a tilted wrapper)
      "  vec2 q = vec2(gl_FragCoord.x, uSize.y * uDpr - gl_FragCoord.y) / uDpr - uSize * 0.5;",
      "  float d = q.x * sin(uTilt) + q.y * cos(uTilt) - uScanY;",
      "  c += uTeal * (exp(-d * d / 90.0) * 1.3 * uScan + step(d, 0.0) * uWash);",
      "  gl_FragColor = vec4(c, a * vEdge);",
      "}"
    ].join("\n");
    // The glow emitter: camera-facing quads at the orb's pivot
    var SPRITE_VERT = [
      "uniform float uSize, uRot;",
      "varying vec2 vUv;",
      "void main() {",
      "  vUv = uv;",
      "  vec4 mv = modelViewMatrix * vec4(0.0, 0.0, 0.0, 1.0);",
      "  mv.xy += mat2(cos(uRot), sin(uRot), -sin(uRot), cos(uRot)) * position.xy * uSize;",
      "  gl_Position = projectionMatrix * mv;",
      "}"
    ].join("\n");
    var SPRITE_FRAG = [
      "uniform sampler2D uTex;",
      "uniform vec3 uColor;",
      "uniform float uAlpha;",
      "varying vec2 vUv;",
      "void main() { gl_FragColor = vec4(texture2D(uTex, vUv).rgb * uColor, uAlpha); }"
    ].join("\n");

    var T, renderer, scene, camera, rig, mixer, U;
    var mats = [], sprites = [], emitter = null, bone0 = null, liftMin = 0, liftAmp = 0, clipLen = 1;
    var size = null, PITCH = .2;
    var ready = false, running = false, onScreen = true, raf = 0, last = 0;
    var t = 0, speed = 1, yaw = 0, pitch = 0, aimX = 0, aimY = 0, hover = 0, hovered = false, scanAt = -1, lastLift = "";
    var beam = el.scan.querySelector(".scan-beam"), tiltEl = canvas.parentElement;

    function decode(b64) {
      var bin = atob(b64), n = bin.length, out = new Uint8Array(n);
      for (var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
      return out.buffer;
    }
    // GLTFLoader decodes embedded images through blob: URLs, which the Artifact's CSP may refuse.
    // data: URIs in an <img> are allowed there, so images are decoded that way instead.
    function dataUriImages(parser) {
      var cache = {};
      parser.loadImageSource = function (index) {
        if (!cache[index]) {
          var def = parser.json.images[index];
          cache[index] = parser.getDependency("bufferView", def.bufferView).then(function (buf) {
            return new Promise(function (resolve, reject) {
              var fr = new FileReader();
              fr.onerror = reject;
              fr.onload = function () {
                var img = new Image();
                img.onload = function () { resolve(img); };
                img.onerror = reject;
                img.src = fr.result;
              };
              fr.readAsDataURL(new Blob([buf], { type: def.mimeType }));
            });
          });
        }
        return cache[index].then(function (img) { var tex = new T.Texture(img); tex.needsUpdate = true; return tex; });
      };
      return { name: "ca_data_uri_images" };
    }
    function sample(times, values, x) {
      var n = times.length;
      if (n < 2 || x <= times[0]) return [].concat(values[0]);
      for (var i = 1; i < n; i++) {
        if (x <= times[i]) {
          var f = (x - times[i - 1]) / (times[i] - times[i - 1]), a = [].concat(values[i - 1]), b = [].concat(values[i]);
          return a.map(function (v, k) { return v + (b[k] - v) * f; });
        }
      }
      return [].concat(values[n - 1]);
    }
    function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

    // Additive light that leaves the canvas alpha alone, so the page shows through unchanged where only glow is drawn
    function additive(m) {
      m.blending = T.CustomBlending;
      m.blendEquation = T.AddEquation;
      m.blendSrc = T.SrcAlphaFactor; m.blendDst = T.OneFactor;
      m.blendSrcAlpha = T.ZeroFactor; m.blendDstAlpha = T.OneFactor;
      return m;
    }
    function wowMaterial(src, tex) {
      var w = src.userData.wow;
      var m = new T.ShaderMaterial({
        vertexShader: VERT, fragmentShader: FRAG,
        uniforms: {
          uTex0: { value: tex[w.textures[0]] }, uTex1: { value: tex[w.textures[1]] },
          uPixel: { value: w.pixel === "Combiners_Mod_Mod" ? 1 : 0 },
          uVertex: { value: w.vertex === "Diffuse_T1_Env" ? 0 : w.vertex.indexOf("EdgeFade") >= 0 ? 1 : 2 },
          uUv0Shift: { value: new T.Vector2() }, uUv1Shift: { value: new T.Vector2() },
          uLit: { value: w.unlit ? 0 : 1 }, uGem: { value: src.name === "gem" ? 1 : 0 },
          uGlow: U.glow, uFlare: U.flare, uHover: U.hover, uScan: U.scan, uScanY: U.scanY, uWash: U.wash, uTilt: U.tilt,
          uDpr: U.dpr, uSize: U.size, uAmbient: U.ambient, uKeyDir: U.keyDir, uKey: U.key, uFillDir: U.fillDir, uFill: U.fill, uTeal: U.teal
        },
        transparent: w.blend >= 2, depthWrite: w.depthWrite, side: src.side,
        blending: w.blend === 2 ? T.NormalBlending : T.NoBlending
      });
      m.userData.uvAnim = w.uvAnim || [];
      return w.blend >= 3 ? additive(m) : m;
    }

    function setup(gltf) {
      var parser = gltf.parser, need = {}, meshes = [];
      gltf.scene.traverse(function (o) {
        if (o.isMesh && o.material && o.material.userData.wow) {
          meshes.push(o);
          o.material.userData.wow.textures.forEach(function (i) { need[i] = true; });
        }
      });
      var node = gltf.scene.getObjectByName("glow_emitter"), wp = node && node.userData.wowParticle;
      if (wp) need[wp.texture] = true;
      var ids = Object.keys(need);
      return Promise.all(ids.map(function (i) { return parser.getDependency("texture", Number(i)); })).then(function (list) {
        var tex = {};
        ids.forEach(function (i, k) { list[k].colorSpace = T.NoColorSpace; tex[i] = list[k]; }); // the game shades in gamma space
        build(gltf, meshes, tex, node, wp);
      });
    }

    function build(gltf, meshes, tex, node, wp) {
      renderer = new T.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, powerPreference: "low-power" });
      renderer.setClearColor(0x000000, 0);
      U = {
        glow: { value: 0 }, flare: { value: 0 }, hover: { value: 0 }, scan: { value: 0 }, scanY: { value: -1e4 }, wash: { value: 0 },
        tilt: { value: 0 }, dpr: { value: 1 }, size: { value: new T.Vector2(1, 1) },
        ambient: { value: new T.Vector3(.36, .39, .48) },
        keyDir: { value: new T.Vector3(-.45, .62, .64).normalize() }, key: { value: new T.Vector3(.9, .8, .7) },
        fillDir: { value: new T.Vector3(.2, -.88, .42).normalize() }, fill: { value: new T.Vector3(.14, .44, .4) },
        teal: { value: new T.Vector3(.4, .937, .863) }
      };
      scene = new T.Scene();
      rig = new T.Group();
      scene.add(rig);
      rig.add(gltf.scene);

      var box = new T.Box3();
      meshes.forEach(function (m) {
        var old = m.material;
        m.material = wowMaterial(old, tex);
        old.dispose();
        m.frustumCulled = false;
        if (m.material.transparent) m.renderOrder = 1;
        if (!m.material.transparent) { m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox); }
        mats.push(m.material);
      });

      mixer = new T.AnimationMixer(gltf.scene);
      var clip = gltf.animations[0];
      bone0 = gltf.scene.getObjectByName("bone0");
      if (clip) {
        mixer.clipAction(clip).play();
        clipLen = clip.duration || 1;
        var track = bone0 && clip.tracks.filter(function (k) { return k.name === bone0.name + ".position"; })[0];
        if (track) {
          var ys = []; for (var i = 1; i < track.values.length; i += 3) ys.push(track.values[i]);
          liftMin = Math.min.apply(null, ys);
          liftAmp = Math.max.apply(null, ys) - liftMin;
        }
      }
      // Centre the opaque body on the rig, halfway through its hover
      var center = box.getCenter(new T.Vector3());
      center.y += liftAmp / 2;
      gltf.scene.position.copy(center).multiplyScalar(-1);
      size = box.getSize(new T.Vector3());
      size.y += liftAmp;

      if (node && wp) {
        var geo = new T.PlaneGeometry(1, 1);
        for (var k = 0, n = Math.ceil(wp.lifespan * wp.rate); k < n; k++) {
          var s = new T.Mesh(geo, additive(new T.ShaderMaterial({
            vertexShader: SPRITE_VERT, fragmentShader: SPRITE_FRAG, transparent: true, depthWrite: false,
            uniforms: { uTex: { value: tex[wp.texture] }, uColor: { value: new T.Vector3() }, uAlpha: { value: 0 }, uSize: { value: 0 }, uRot: { value: 0 } }
          })));
          s.frustumCulled = false;
          s.renderOrder = 2;
          node.add(s);
          sprites.push(s);
        }
        emitter = wp;
      }

      camera = new T.PerspectiveCamera(22, 1, .05, 50);
      resize();
      try { renderSide(); } catch (e) { /* keep the cutout in the archive header */ }
      ready = true;
      draw(performance.now());
      el.core.classList.add("is-3d");
      if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas); else window.addEventListener("resize", resize);
      if (window.IntersectionObserver) new IntersectionObserver(function (es) { onScreen = es[es.length - 1].isIntersecting; if (onScreen) api.resume(); else stop(); }).observe(canvas);
      document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else api.resume(); });
      el.stage.addEventListener("pointermove", function (e) {
        if (e.pointerType !== "mouse") return;
        var r = el.construct.getBoundingClientRect();
        aimX = Math.max(-1, Math.min(1, (e.clientX - r.left - r.width / 2) / (innerWidth / 2)));
        aimY = Math.max(-1, Math.min(1, (e.clientY - r.top - r.height / 2) / (innerHeight / 2)));
      });
      el.stage.addEventListener("pointerleave", function () { aimX = aimY = 0; });
      ["pointerenter", "focus"].forEach(function (n) { el.construct.addEventListener(n, function () { hovered = true; }); });
      ["pointerleave", "blur"].forEach(function (n) { el.construct.addEventListener(n, function () { hovered = false; }); });
      canvas.addEventListener("webglcontextlost", function (e) { e.preventDefault(); stop(); el.core.classList.remove("is-3d"); });
      canvas.addEventListener("webglcontextrestored", function () { draw(performance.now()); el.core.classList.add("is-3d"); api.resume(); });
      api.resume();
    }

    // Distance at which a box of width w and height h (model units) fills `fill` of the frame
    function placeCamera(cam, yawDeg, pitchRad, w, h, fill) {
      var tv = Math.tan(cam.fov * Math.PI / 360), th = tv * cam.aspect;
      var d = Math.max(w / 2 / (fill * th), h / 2 / (fill * tv));
      var a = yawDeg * Math.PI / 180;
      cam.position.set(d * Math.cos(pitchRad) * Math.sin(a), d * Math.sin(pitchRad), d * Math.cos(pitchRad) * Math.cos(a));
      cam.lookAt(0, 0, 0);
      cam.updateProjectionMatrix();
    }
    function resize() {
      var dpr = Math.min(2, window.devicePixelRatio || 1), w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      U.dpr.value = dpr;
      U.size.value.set(w, h);
      camera.aspect = w / h;
      placeCamera(camera, 0, PITCH, size.x, size.y, .56);
      if (ready && !running) draw(performance.now());
    }

    // Archive header: one still from the side, replacing the side cutout
    function renderSide() {
      var img = el.plate.querySelector(".unit img");
      if (!img) return;
      var w = 864, h = 544, cam = new T.PerspectiveCamera(18, w / h, .05, 50);
      placeCamera(cam, 78, .16, size.z, size.y, .94);
      rig.rotation.set(0, 0, 0);
      pose(1.2);
      var rt = new T.WebGLRenderTarget(w, h);
      renderer.setRenderTarget(rt);
      renderer.clear();
      renderer.render(scene, cam);
      var px = new Uint8Array(w * h * 4);
      renderer.readRenderTargetPixels(rt, 0, 0, w, h, px);
      renderer.setRenderTarget(null);
      rt.dispose();
      var big = document.createElement("canvas"), ctx = big.getContext("2d");
      big.width = w; big.height = h;
      var id = ctx.createImageData(w, h);
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var s = ((h - 1 - y) * w + x) * 4, o = (y * w + x) * 4;
          var r = px[s], g = px[s + 1], b = px[s + 2], a = Math.max(px[s + 3], r, g, b); // additive glow keeps its light
          if (!a) continue;
          id.data[o] = r * 255 / a; id.data[o + 1] = g * 255 / a; id.data[o + 2] = b * 255 / a; id.data[o + 3] = a;
        }
      }
      ctx.putImageData(id, 0, 0);
      var out = document.createElement("canvas");
      out.width = w / 2; out.height = h / 2;
      out.getContext("2d").drawImage(big, 0, 0, w / 2, h / 2);
      img.src = out.toDataURL("image/png");
    }

    // Pose everything for model time `at` (seconds)
    function pose(at) {
      mixer.setTime(at % clipLen);
      mats.forEach(function (m) {
        m.userData.uvAnim.forEach(function (a, slot) {
          if (!a) return;
          var v = sample(a.times, a.translate, a.period ? at % a.period : at);
          m.uniforms[slot ? "uUv1Shift" : "uUv0Shift"].value.set(v[0], v[1]);
        });
      });
      if (emitter) {
        var born = at * emitter.rate, whole = Math.floor(born);
        sprites.forEach(function (s, k) {
          var f = Math.min(1, (born - whole + k) / emitter.rate / emitter.lifespan), u = s.material.uniforms;
          var col = sample(emitter.color.t, emitter.color.v, f);
          u.uColor.value.set(col[0], col[1], col[2]);
          u.uAlpha.value = sample(emitter.alpha.t, emitter.alpha.v, f)[0];
          u.uSize.value = sample(emitter.scale.t, emitter.scale.v, f)[0] * emitter.sizeScale;
          u.uRot.value = (hash(whole - k) * 2 - 1) * emitter.spinVary;
        });
      }
    }

    function step(dt, now) {
      var scanning = scanAt >= 0, since = scanning ? (now - scanAt) / 1000 : 0, k = Math.min(1, dt * 3);
      speed += ((scanning ? .15 : 1) - speed) * Math.min(1, dt * 5);
      t += dt * speed;
      pose(reduced ? 1.2 : t);
      hover += ((hovered ? 1 : 0) - hover) * Math.min(1, dt * 6);
      yaw += ((reduced ? .32 : Math.sin(t * Math.PI * 2 / 17) * .38) + aimX * .35 - yaw) * (reduced ? 1 : k);
      pitch += (aimY * .14 - pitch) * (reduced ? 1 : k);
      rig.rotation.set(pitch, yaw, 0);
      U.hover.value = hover;
      U.glow.value = .5 + .5 * Math.sin(now / 1000 * Math.PI * 2 / 3.4);
      U.flare.value = scanning ? (since < .34 ? since / .34 : 1 - .7 * Math.min(1, (since - .34) / 1.56)) : 0;
      if (scanning && beam) {
        var b = beam.getBoundingClientRect(), r = canvas.getBoundingClientRect(), m = getComputedStyle(tiltEl).transform;
        var mx = m && m !== "none" && window.DOMMatrixReadOnly ? new DOMMatrixReadOnly(m) : null;
        U.scanY.value = b.bottom - 1 - (r.top + r.height / 2);
        U.tilt.value = mx ? Math.atan2(mx.b, mx.a) : 0;
        U.scan.value = since < 1.45 ? 1 : Math.max(0, 1 - (since - 1.45) / .4);
        U.wash.value = .14 * U.scan.value;
      } else {
        U.scan.value = U.wash.value = 0;
      }
      if (liftAmp && bone0) {
        var lift = ((bone0.position.y - liftMin) / liftAmp).toFixed(2);
        if (lift !== lastLift) { el.core.style.setProperty("--lift", lift); lastLift = lift; }
      }
    }
    function draw(now) {
      step(last && running ? Math.min(.1, (now - last) / 1000) : 0, now);
      last = now;
      renderer.render(scene, camera);
    }
    function frame(now) {
      raf = 0;
      if (!running) return;
      draw(now);
      raf = requestAnimationFrame(frame);
    }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }

    api.resume = function () {
      if (!ready || running || document.hidden || el.archive.open || !onScreen) return;
      if (reduced) { draw(performance.now()); return; }
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    };
    api.pause = function () { stop(); scanAt = -1; };
    api.scan = function () { if (ready && !reduced) scanAt = performance.now(); };

    Promise.all([import(THREE_URL), import(GLTF_URL)]).then(function (mods) {
      T = mods[0];
      var loader = new mods[1].GLTFLoader();
      loader.register(dataUriImages);
      return new Promise(function (resolve, reject) { loader.parse(decode(SRC.model), "", resolve, reject); });
    }).then(setup).catch(function (e) {
      if (window.console) console.warn("Chalice model unavailable; showing the image instead.", e);
    });
    return api;
  })();

  // ---------- Scan ----------
  var scanning = false;
  function readoutLines() {
    var n = state.records.length, latest = sorted()[0];
    function row(k, v) { return k + " " + ".".repeat(Math.max(2, 15 - k.length)) + " " + v; }
    return [
      "archival scan",
      "unit · " + (state.profile.construct || "construct"),
      row("records", pad2(n)),
      row("domains", pad2(domains().length)),
      row("latest", latest ? latest.date : "none"),
      "index ready"
    ];
  }
  function scan(opts) {
    if (scanning || el.archive.open) return;
    scanning = true;
    el.stage.classList.add("is-scanning");
    var done;
    if (reduced) {
      done = wait(250);
    } else {
      el.scan.hidden = false;
      void el.scan.offsetWidth;
      el.scan.classList.add("run");
      model3d.scan();
      var lines = readoutLines();
      el.scanReadout.textContent = "";
      lines.forEach(function (line, i) {
        setTimeout(function () { el.scanReadout.textContent += (i ? "\n" : "") + line; }, 120 + i * 230);
      });
      done = wait(1950);
    }
    done.then(function () {
      openArchive(opts);
      el.scan.classList.remove("run");
      el.scan.hidden = true;
      el.scanReadout.textContent = "";
      el.stage.classList.remove("is-scanning");
      scanning = false;
    });
  }

  // ---------- Events ----------
  el.construct.addEventListener("click", function () { scan({ view: "overview" }); });
  el.latest.addEventListener("click", function () { if (el.latest.dataset.id) scan({ view: "detail", id: el.latest.dataset.id }); });
  el.btnClose.addEventListener("click", function () { el.archive.close(); });
  el.archive.addEventListener("click", function (e) {
    if (e.target === el.archive && (currentView === "overview" || currentView === "detail")) el.archive.close();
  });
  el.archive.addEventListener("cancel", function (e) {
    if (currentView === "form") { e.preventDefault(); leaveForm(); }
    else if (currentView === "profile") { e.preventDefault(); showView("overview"); }
  });
  el.archive.addEventListener("close", function () {
    root.append(el.toast);
    disarm(el.detDelete); disarm(el.btnClearExamples);
    motes.resume();
    model3d.resume();
    el.construct.focus({ preventScroll: true });
  });
  el.detBack.addEventListener("click", function () { showView("overview"); });
  el.detEdit.addEventListener("click", function () { openForm(detailId); });
  el.btnInscribe.addEventListener("click", function () { openForm(null); });
  el.btnProfile.addEventListener("click", openProfile);

  // ---------- Boot ----------
  renderLanding();
  motes.resume();

  var after = null;
  try { after = JSON.parse(sessionStorage.getItem("ca-after") || "null"); sessionStorage.removeItem("ca-after"); } catch (e) { after = null; }
  if (after) { openArchive(after); toast(after.toast); }

  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (res) {
      var art = res[0], user = res[1];
      if (!art || !user) return null;
      return Promise.all([user.canEdit(), user.isOwner()]).then(function (r) {
        if (r[0] || r[1]) { api = art; canWrite = true; renderOwnerUI(); if (el.archive.open && currentView === "overview") renderArchive(); }
      });
    }).catch(function () {});
  }
})();
</script>
</body></html>
